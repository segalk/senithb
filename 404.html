<!--
  Styles are inlined rather than pulled from css/style.css on purpose. GitHub
  Pages serves this file for ANY unmatched path, including deep ones like
  /senithb/a/b/c -- and every asset path in this project is relative, so a
  linked stylesheet would resolve against /senithb/a/b/ and 404 as well,
  leaving an unstyled page. Self-contained is the only version that always
  renders -- which is why the favicon above is a data uri too: any path-based
  reference would break either at depth or after the move to a custom domain.
-->
<style>
  :root { color-scheme: dark; --bg:#121212; --text:#f5f5f5; --muted:#a0a6ad; --accent:#E64A2E; }
  :root[data-theme="light"] { color-scheme: light; --bg:#f2f2f2; --text:#141414; --muted:#7E858B; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100svh;
    display: flex; align-items: center; justify-content: center;
    padding: 48px 24px;
    background: var(--bg); color: var(--text);
    font-family: Inter, 'Helvetica Neue', Arial, sans-serif;
    line-height: 1.6; -webkit-font-smoothing: antialiased;
    text-align: center;
  }
  .wrap { max-width: 520px; }
  .code {
    font-size: clamp(3.4rem, 12vw, 5.5rem); font-weight: 800;
    letter-spacing: -0.03em; line-height: 1; color: var(--accent);
  }
  h1 { font-size: clamp(1.4rem, 4vw, 1.9rem); font-weight: 700; letter-spacing: -0.02em; margin: 18px 0 14px; }
  p { color: var(--muted); margin-bottom: 34px; }
  .home {
    display: inline-flex; align-items: center; gap: 10px;
    background: var(--accent); color: #fff; text-decoration: none;
    font-weight: 700; font-size: 0.98rem;
    padding: 15px 30px; border-radius: 999px;
    transition: transform 0.25s ease;
  }
  .home:hover { transform: translateY(-2px); }
  .home:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) { .home { transition: none; } }
</style>
<script>
  // Match whatever theme the visitor last chose on the main site.
  try { if (localStorage.getItem('theme') === 'light') document.documentElement.setAttribute('data-theme','light'); } catch (e) {}
</script>
</head>
<body>
  <main class="wrap">
    <p class="code">404</p>
    <h1>This page doesn't exist</h1>
    <p>The link may be out of date, or mistyped. Everything is one click away from the homepage.</p>
    <a class="home" id="homeLink" href="/senithb/">Back to the portfolio &rarr;</a>
  </main>
<script>
  // Hard-coded to the project path so it is correct with JavaScript off today.
  // Once a custom domain is live the site sits at the root instead, so rewrite
  // it there. Keeps working across the migration without a second edit.
  (function () {
    if (!/\.github\.io$/.test(location.hostname)) {
      document.getElementById('homeLink').setAttribute('href', '/');
    }
  })();
</script>
</body>
